<div
    class="modal-editar-cliente"
    id="modal-editar-cliente"
    hidden
>
    <div class="contenido-modal-editar-cliente">

        <div class="encabezado-modal-editar-cliente">
            <div>
                <h2>Editar cliente</h2>
                <p>Modificá los datos del cliente.</p>
            </div>

            <button
                type="button"
                id="cerrar-modal-editar-cliente"
                class="cerrar-modal-editar-cliente"
            >
                ×
            </button>
        </div>

        <div class="cuerpo-modal-editar-cliente">

            <div class="campo-editar-cliente">
                <label for="editar-nombre-cliente">
                    Nombre
                </label>

                <input
                    type="text"
                    id="editar-nombre-cliente"
                    autocomplete="off"
                >
            </div>

            <div class="campo-editar-cliente">
                <label for="editar-apellido-cliente">
                    Apellido
                </label>

                <input
                    type="text"
                    id="editar-apellido-cliente"
                    autocomplete="off"
                >
            </div>

            <div class="campo-editar-cliente">
                <label for="editar-dni-cliente">
                    DNI
                </label>

                <input
                    type="text"
                    id="editar-dni-cliente"
                    autocomplete="off"
                >
            </div>

            <div class="campo-editar-cliente">
                <label for="editar-telefono-cliente">
                    Teléfono
                </label>

                <input
                    type="text"
                    id="editar-telefono-cliente"
                    autocomplete="off"
                >
            </div>

        </div>

        <div class="acciones-modal-editar-cliente">

            <button
                type="button"
                id="cancelar-editar-cliente"
                class="boton-cancelar-editar-cliente"
            >
                Cancelar
            </button>

            <button
                type="button"
                id="guardar-editar-cliente"
                class="boton-guardar-editar-cliente"
            >
                Guardar cambios
            </button>

        </div>

    </div>
</div>
