<section class="pantalla-login">

    <div class="login-contenedor">

        <div class="logo-contenedor">

            <img
                src="assets/logo-helen.png"
                alt="Helen"
                class="logo-helen"
            >

        </div>


        <div class="login-card">

            <div class="login-header">

                <h1>
                    Iniciar sesión
                </h1>

                <p>
                    Ingresá a tu cuenta para continuar
                </p>

            </div>


            <form id="formulario-login">

                <!-- ========================================
                     CORREO
                ======================================== -->

                <div class="campo">

                    <div
                        class="icono-campo icono-email"
                    ></div>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Correo electrónico"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- ========================================
                     CONTRASEÑA
                ======================================== -->

                <div class="campo">

                    <div
                        class="icono-campo icono-lock"
                    ></div>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="boton-mostrar"
                        id="mostrar-contrasena"
                        aria-label="Mostrar contraseña"
                    >

                        <span class="icono-eye"></span>

                    </button>

                </div>


                <!-- ========================================
                     RECORDAR SESIÓN
                ======================================== -->

                <div class="opciones-login">

                    <label class="recordar">

                        <input
                            type="checkbox"
                            id="recordar-sesion"
                            checked
                        >

                        <span
                            class="checkbox-personalizado"
                        ></span>

                        <span>
                            Recordar sesión
                        </span>

                    </label>

                </div>


                <!-- ========================================
                     BOTÓN INICIAR SESIÓN
                ======================================== -->

                <button
                    type="submit"
                    class="boton-login"
                >

                    <span>
                        Iniciar sesión
                    </span>

                    <span class="flecha-login">
                        →
                    </span>

                </button>

            </form>

        </div>


        <!-- ========================================
             FRASE INFERIOR
        ======================================== -->

        <div class="frase-inferior">

            <span></span>

            <p>
                TU ESTILO, NUESTRA ESENCIA.
            </p>

            <span></span>

        </div>

    </div>

</section>
